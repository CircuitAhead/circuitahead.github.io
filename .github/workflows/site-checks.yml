name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated catalog and directories
        run: python3 scripts/build-catalog.py --check
      - name: Check app and game catalog scenarios
        run: python3 scripts/test-catalog.py
      - name: Check every public page and asset
        run: python3 scripts/check-site.py
      - name: Check JavaScript syntax
        run: |
          node --check js/language.js
          node --check js/main.js
          node --check js/motion.js
          node --check js/diagnostics.js
          node --check js/translations.js
